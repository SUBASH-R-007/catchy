server.port=8090
# 40 % of the 50,000-drug catalogue. At 10,000 the best possible hit rate (~92 %) caps the speedup
# at ~10x (measured 9.8-10.2x); 20,000 gives headroom. See docs/DECISIONS.md.
cachelab.caches.formulary.maximum-size=20000
cachelab.caches.formulary.policy=lfu
cachelab.caches.formulary.default-ttl=10m
cachelab.caches.formulary.concurrency-level=16
management.endpoints.web.exposure.include=health,prometheus
