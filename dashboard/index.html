<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="CATCHY — AcentraCache Insight: cache health, Policy Arena and Eviction X-ray for Acentra engineers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CATCHY — AcentraCache Insight</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash (storage may throw; ignore).
      try {
        var t = window.localStorage.getItem('catchy.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
