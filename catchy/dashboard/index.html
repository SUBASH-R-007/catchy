<!doctype html>
<html lang="en" data-theme="pcb-blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CacheLab live metrics panel: LRU vs LFU eviction, TTL and thread safety."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CacheLab</title>
    <script>
      // Apply persisted theme and animation choices before first paint (no flash).
      try {
        var t = localStorage.getItem('cachelab.theme');
        if (t === 'pcb-blue' || t === 'pcb-amber') document.documentElement.dataset.theme = t;
        if (localStorage.getItem('cachelab.animation') === 'off')
          document.documentElement.dataset.animation = 'off';
      } catch (e) {
        /* storage unavailable: keep defaults */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
