name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java (build, tests, Spotless, zero-dependency core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless and build (all tests)
        run: ./gradlew spotlessCheck build
      - name: cache-core has zero runtime dependencies
        run: |
          ./gradlew -q :cache-core:dependencies --configuration runtimeClasspath | tee deps.txt
          grep -q "No dependencies" deps.txt
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: '**/build/reports/tests/'

  dashboard:
    name: Dashboard (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test -- --run
      - name: Circuit board is deterministic
        run: node scripts/generate-circuit.mjs --check
      - run: npm run build
