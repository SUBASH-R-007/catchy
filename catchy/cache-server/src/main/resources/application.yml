server:
  port: 8080

spring:
  application:
    name: cachelab-server
  mvc:
    problemdetails:
      enabled: true # errors are RFC 7807 ProblemDetail

springdoc:
  swagger-ui:
    path: /swagger-ui

cachelab:
  metrics:
    # false (default from Step 3): the SSE stream reports the live caches, simulations and removals.
    # true: the seeded fake generator (dashboard development only; ignores the real caches).
    fake: false
    seed: 42 # seed of the fake generator
  cost:
    per-thousand-calls: 0.05
    currency: "$"
    mean-db-latency-ms: 12.5
